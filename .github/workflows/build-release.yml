name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
          - os: macos-latest
            build-script: build:mac
          # Keep the Linux release environment stable during the Ubuntu 26 rollout.
          - os: ubuntu-24.04
            build-script: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Castlabs Electron
        # Electron 42+ downloads on first use instead of during npm install.
        # Fetch explicitly here so upstream failures can be retried cleanly.
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Electron download failed (attempt $attempt/4). Retrying..."
              sleep $((attempt * 10))
            fi
          done
          echo "Electron download failed after 4 attempts."
          exit 1

      - name: Run unit tests
        run: npm test

      - name: Verify browser runtime on Windows
        if: runner.os == 'Windows'
        run: npm run test:runtime:electron

      - name: Build and publish
        run: npm run ${{ matrix.build-script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
